<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookmark Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #141B22;
    --ink-soft: #1C252E;
    --paper: #F7F4EC;
    --brass: #B08D57;
    --brass-bright: #D4AF6A;
    --slate: #4A5560;
    --slate-light: #8A94A0;
    --rust: #B5533C;
    --shadow: rgba(10, 14, 18, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(176,141,87,0.07), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(176,141,87,0.05), transparent 45%);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid rgba(176,141,87,0.35);
    padding-bottom: 20px;
    margin-bottom: 36px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .drawer-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass-bright);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 40px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .count-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--slate-light);
    border: 1px solid rgba(138,148,160,0.35);
    border-radius: 999px;
    padding: 6px 14px;
  }

  .catalog-form {
    background: var(--ink-soft);
    border: 1px solid rgba(176,141,87,0.25);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 40px;
    display: grid;
    grid-template-columns: 1.3fr 1.5fr 0.9fr auto;
    gap: 12px;
    align-items: end;
  }

  @media (max-width: 720px) {
    .catalog-form { grid-template-columns: 1fr; }
  }

  .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--slate-light);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .field input {
    width: 100%;
    background: var(--ink);
    border: 1px solid rgba(138,148,160,0.3);
    border-radius: 6px;
    padding: 11px 12px;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    transition: border-color 0.15s ease;
  }

  .field input::placeholder { color: rgba(138,148,160,0.6); }

  .field input:focus {
    outline: none;
    border-color: var(--brass-bright);
  }

  .add-btn {
    background: var(--brass);
    color: var(--ink);
    border: none;
    border-radius: 6px;
    padding: 12px 22px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }

  .add-btn:hover { background: var(--brass-bright); }
  .add-btn:active { transform: scale(0.97); }
  .add-btn:focus-visible { outline: 2px solid var(--brass-bright); outline-offset: 2px; }

  #banner {
    display: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: rgba(181,83,60,0.12);
    border: 1px solid rgba(181,83,60,0.5);
    color: #E8998A;
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 24px;
  }

  #list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .card {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 22px 18px 18px;
    box-shadow: 0 8px 20px var(--shadow);
    animation: cardIn 0.35s ease both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 24px;
    width: 14px;
    height: 14px;
    background: var(--ink);
    border-radius: 50%;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.4);
  }

  .tab {
    position: absolute;
    top: -12px;
    right: 18px;
    background: var(--brass);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 3px 3px 0 0;
    text-transform: uppercase;
  }

  .card h3 {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 600;
    margin: 8px 0 6px;
    line-height: 1.25;
  }

  .card h3 a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid rgba(20,27,34,0.2);
  }
  .card h3 a:hover { border-bottom-color: var(--ink); }

  .card .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--slate);
    word-break: break-all;
    display: block;
    margin-bottom: 16px;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px dashed rgba(20,27,34,0.18);
    padding-top: 12px;
  }

  .card-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--slate-light);
  }

  .withdraw-btn {
    background: none;
    border: 1px solid rgba(181,83,60,0.4);
    color: var(--rust);
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .withdraw-btn:hover { background: var(--rust); color: var(--paper); }
  .withdraw-btn:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    border: 1px dashed rgba(176,141,87,0.35);
    border-radius: 10px;
    color: var(--slate-light);
  }

  .empty-state p.lead {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--paper);
    margin: 0 0 6px;
  }

  .empty-state p.sub {
    font-size: 13px;
    margin: 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <p class="drawer-label">Drawer 01 — General Reference</p>
      <h1>Bookmark Catalog</h1>
    </div>
    <span class="count-tag" id="count">0 entries</span>
  </header>

  <form class="catalog-form" id="bookmarkForm">
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="MDN Web Docs" required />
    </div>
    <div class="field">
      <label for="url">URL</label>
      <input type="text" id="url" placeholder="https://developer.mozilla.org" required />
    </div>
    <div class="field">
      <label for="category">Category</label>
      <input type="text" id="category" placeholder="reference" />
    </div>
    <button type="submit" class="add-btn">File entry</button>
  </form>

  <div id="banner"></div>

  <ul id="list"></ul>
</div>

<script>
const API = "http://localhost:5000/api/v1/bookmarks";

const listEl = document.getElementById("list");
const bannerEl = document.getElementById("banner");
const countEl = document.getElementById("count");
const formEl = document.getElementById("bookmarkForm");

function showBanner(msg) {
  bannerEl.textContent = "! " + msg;
  bannerEl.style.display = "block";
}
function clearBanner() {
  bannerEl.style.display = "none";
}

function tabLabel(category) {
  if (!category) return "GEN";
  return category.trim().slice(0, 4).toUpperCase();
}

function renderBookmarks(bookmarks) {
  listEl.innerHTML = "";
  countEl.textContent = bookmarks.length === 1 ? "1 entry" : `${bookmarks.length} entries`;

  if (bookmarks.length === 0) {
    listEl.innerHTML = `
      <li class="empty-state">
        <p class="lead">Drawer is empty</p>
        <p class="sub">File your first bookmark using the form above.</p>
      </li>`;
    return;
  }

  bookmarks.forEach(b => {
    const li = document.createElement("li");
    li.className = "card";
    li.innerHTML = `
      <span class="tab">${tabLabel(b.category)}</span>
      <h3><a href="${b.url}" target="_blank" rel="noopener">${b.title}</a></h3>
      <span class="url">${b.url}</span>
      <div class="card-footer">
        <span class="card-id">#${b.id}</span>
        <button class="withdraw-btn" data-id="${b.id}">Withdraw</button>
      </div>
    `;
    listEl.appendChild(li);
  });
}

async function fetchBookmarks() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    clearBanner();
    renderBookmarks(data);
  } catch (err) {
    showBanner("Catalog server unreachable — confirm it's running on port 5000.");
  }
}

formEl.addEventListener("submit", async (e) => {
  e.preventDefault();

  const title = document.getElementById("title").value.trim();
  const url = document.getElementById("url").value.trim();
  const category = document.getElementById("category").value.trim();

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, url, category })
    });

    const data = await res.json();

    if (!res.ok) {
      showBanner(data.error || "Could not file this entry.");
      return;
    }

    clearBanner();
    formEl.reset();
    fetchBookmarks();
  } catch (err) {
    showBanner("Catalog server unreachable — confirm it's running on port 5000.");
  }
});

listEl.addEventListener("click", async (e) => {
  if (!e.target.matches(".withdraw-btn")) return;
  const id = e.target.dataset.id;
  try {
    const res = await fetch(`${API}/${id}`, { method: "DELETE" });
    if (!res.ok && res.status !== 204) throw new Error("delete failed");
    fetchBookmarks();
  } catch (err) {
    showBanner("Could not withdraw that entry — try again.");
  }
});

fetchBookmarks();
</script>

</body>
</html>
